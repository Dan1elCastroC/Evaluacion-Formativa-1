<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evaluación Formativa 1</title>
    <!-- CDN de Bootstrap -->
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    />
    <!-- Archivo CSS externo en la ruta solicitada -->
    <link rel="stylesheet" href="assets/estilo.css" />
</head>



<body>
    <header class="bg-light py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <nav>
                <a href="index.html" class="text-decoration-none fw-bold">HOME</a>
            </nav>
            <h1 class="m-0" style="font-family: 'Arial', sans-serif; color: #333;">GUAU&MIAU</h1>
            <button class="btn btn-dark">INICIAR SESIÓN</button>
        </div>
</header>

    <main class="container mt-4 text-center">
        <div class="container mt-3">
            <section class="text-center">
                <h2 class="mb-4" style="font-family: 'Arial', sans-serif; color: #333;">¡Bienvenido a GUAU&MIAU!</h2>
                <p class="mb-4" style="font-family: 'Arial', sans-serif; color: #555;">Encuentra todo lo que necesitas para tus mascotas en un solo lugar.</p>
                <a href="productos.html" class="btn btn-primary">Ver Productos</a>
                <article class="mt-5">
                    <form>
                        <div class="mb-3">
                            <label for="nombre" class="form-label" style="font-family: 'Arial', sans-serif; color: #333;">Nombre:</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label" style="font-family: 'Arial', sans-serif; color: #333;">Email:</label>
                            <input type="email" class="form-control" id="email" placeholder="Ingresa tu email">
                        </div>

                        <div class="mb-3">
                            <label for="contraseña" class="form-label" style="font-family: 'Arial', sans-serif; color: #333;">Contraseña:</label>
                            <input type="password" class="form-control" id="contraseña" placeholder="Ingresa tu contraseña">
                        </div>
                        <div>
                            <label for="confirmarContraseña" class="form-label" style="font-family: 'Arial', sans-serif; color: #333;">Confirmar Contraseña:</label>
                            <input type="password" class="form-control" id="confirmarContraseña" placeholder="Confirma tu contraseña">
                        </div>
                        <div>
                            <br>
                        <button type="submit" class="btn btn-primary" style="font-family: 'Arial', sans-serif; color: #333; text-align: center; padding: 10px 20px;">Enviar</button>
                        
                        </div>

                        <div>
                            <br>
                        <h3 class="mb-3" style="font-family: 'Arial', sans-serif; color: #333;">Nuestros Servicios</h3>
                        <p style="font-family: 'Arial', sans-serif; color: #555;">Ofrecemos una amplia gama de servicios para el cuidado de tus mascotas, incluyendo peluquería, entrenamiento y consultas veterinarias.</p>
                        </div>
                    </form>
                </article>

            </section>
        </div>
    </main>


</body>
</html>
