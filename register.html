<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Guau&Miau</title>
    <!-- CDN de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Archivo CSS externo en la ruta solicitada -->
    <link rel="stylesheet" href="assets/estilo.css" />
</head>
<body>
    <header class="bg-light py-3 border-bottom">
        <div class="container d-flex justify-content-between align-items-center">
            <nav>
                <a href="index.html" class="text-decoration-none fw-bold text-dark">HOME</a>
            </nav>
            <h1 class="m-0" style="font-family: 'Arial', sans-serif; color: #333;">GUAU&MIAU</h1>
            <a class="btn btn-dark" href="login.html">INICIAR SESIÓN</a>
        </div>
    </header>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <section class="card shadow-sm rounded-0 border-dark">
                    <div class="card-header rounded-0" style="background-color: #d8d8d8;">
                        <h2 class="h5 m-0 text-dark font-weight-bold">Registro de usuario</h2>
                    </div>
                    <article class="card-body p-4">
                        <form id="registroForm">
                            <!-- Nombre Completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">NOMBRE COMPLETO</label>
                                <input type="text" class="form-control" id="nombre" maxlength="50" required>
                                <div id="errorNombre" class="text-danger small mt-1"></div>
                            </div>
                            
                            <!-- Correo -->
                            <div class="mb-3">
                                <label for="correo" class="form-label">CORREO</label>
                                <input type="email" class="form-control" id="correo" placeholder="usuario@duoc.cl" required>
                                <div id="errorCorreo" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">CONTRASEÑA</label>
                                <input type="password" class="form-control" id="password" required>
                                <div id="errorPassword" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Confirmar Contraseña -->
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">CONFIRMAR CONTRASEÑA</label>
                                <input type="password" class="form-control" id="confirm_password" required>
                                <div id="errorConfirm" class="text-danger small mt-1"></div>
                            </div>

                            <!-- Teléfono -->
                            <div class="mb-4">
                                <label for="telefono" class="form-label">TELÉFONO (opcional)</label>
                                <input type="tel" class="form-control" id="telefono">
                            </div>

                            <!-- Sección Registro de Mascotas -->
                            <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
                                <h3 class="h6 m-0 text-uppercase fw-bold text-secondary">REGISTRO DE MASCOTA</h3>
                                <button type="button" class="btn btn-outline-dark btn-sm" id="btnAnadirMascota">AÑADIR NUEVO REGISTRO</button>
                            </div>

                            <!-- Contenedor dinámico de Mascotas -->
                            <div id="contenedorMascotas">
                                <div class="mascota-item border border-dark p-3 mb-3 bg-white">
                                    <div class="mb-3">
                                        <label class="form-label">NOMBRE COMPLETO</label>
                                        <input type="text" class="form-control nombre-mascota" maxlength="50" required>
                                        <div class="error-mascota-nombre text-danger small mt-1"></div>
                                    </div>
                                    <div class="mb-3 d-flex gap-2">
                                        <div class="w-100">
                                            <select class="form-select tipo-mascota" required>
                                                <option value="">-- selecciona un tipo de mascota --</option>
                                                <option value="Perro">PERRO</option>
                                                <option value="Gato">GATO</option>
                                                <option value="Ave">AVE</option>
                                                <option value="Otro">OTRO</option>
                                            </select>
                                            <div class="error-mascota-tipo text-danger small mt-1"></div>
                                        </div>
                                        <button type="button" class="btn btn-danger btn-sm btnEliminarMascota px-3 h-100">ELIMINAR</button>
                                    </div>
                                </div>
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-outline-dark px-5 py-2">REGISTRAR</button>
                            </div>
                        </form>
                    </article>
                </section>
            </div>
        </div>
    </main>

    <footer class="custom-footer mt-5 py-4 bg-light text-center border-top">
        <p class="m-0 text-muted">© 2026 Tienda Guau&Miau. Todos los derechos reservados.</p>
    </footer>
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Vinculación del JS centralizado -->
    <script src="assets/script.js"></script>
</body>
</html>
